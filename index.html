<style>
/* ===== 普普風 Pop style ===== */
:root{
  --bg:#fffaf0; --paper:#ffffff; --ink:#141414; --ink-soft:#3d3d3d; --ink-faint:#767676;
  --red:#ff4d3d; --red-deep:#e0301f; --red-soft:#ffe1dc;
  --blue:#2f6bff; --blue-deep:#1d4fd6; --blue-soft:#dfe8ff;

  --shadow:5px 5px 0 var(--ink);
  --shadow-sm:3px 3px 0 var(--ink);
  --radius:14px;
  --display:"Noto Sans TC", system-ui, sans-serif;
  --sans:"Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
.sub-tag{background:var(--yellow) !important; border-color:var(--ink) !important; font-weight:900}
.btn-sub{background:var(--yellow)}
.subbox{display:flex; flex-direction:column; gap:14px}
.subbox .row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.subbox label{display:flex; flex-direction:column; gap:5px; font-size:.86rem; font-weight:900; min-width:0}
.subbox select, .subbox textarea{font:inherit; font-size:.95rem; font-weight:400; padding:9px 11px; border:2px solid var(--ink); border-radius:10px; background:#fff; width:100%}
.subbox textarea{resize:vertical; min-height:80px}
.sub-state{padding:12px 14px; border:2px solid var(--ink); border-radius:12px; background:var(--yellow-soft); font-weight:700}
.sub-state.on{background:#d9f2e6}
.sub-prices{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
.sub-price{border:2px solid var(--ink); border-radius:12px; padding:12px 14px; background:var(--paper)}
.sub-price b{display:block; font-size:1.05rem}
.sub-pay{padding:12px 14px; border:2px dashed var(--ink); border-radius:12px; background:#fff; font-size:.93rem}
.sub-pay p{margin:0 0 8px}
.sub-msg{font-weight:700; margin:0}
.sub-req{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; padding:8px 0; border-top:1px dashed var(--ink-faint); font-size:.9rem}
.sub-req:first-child{border-top:0}
.subbox > h3{margin:0; font-size:1.15rem}
.sub-sec{margin:4px 0 -4px; font-size:1rem}
.sub-renew summary{cursor:pointer; font-weight:900; padding:6px 0}
.sub-renew[open]{display:flex; flex-direction:column; gap:14px}
.cmp{width:100%; border-collapse:collapse; font-size:.92rem; table-layout:fixed}
.cmp th,.cmp td{border-top:1px dashed var(--ink-faint); padding:9px 6px; vertical-align:top; text-align:left; overflow-wrap:anywhere}
.cmp thead th{border-top:0; border-bottom:2px solid var(--ink); font-weight:900}
.cmp th:first-child{width:42%}
.cmp td{text-align:center}
.cmp thead th:not(:first-child){text-align:center}
.cmp-sum{margin:14px 0 12px; font-weight:700}
@media (max-width:560px){ .cmp{font-size:.82rem} .cmp th,.cmp td{padding:8px 3px} }
.wa-box{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 20px; margin-top:20px}
.wa-box h3{margin:0 0 4px; font-size:1.05rem}
.wa-box p{margin:0; color:var(--ink-soft); max-width:38em}
html{scroll-behavior:smooth; scroll-padding-top:76px}
body{
  margin:0; font-family:var(--sans); color:var(--ink); line-height:1.65;
  background-color:var(--bg);
  background-image:radial-gradient(rgba(20,20,20,.07) 1.2px, transparent 1.3px);
  background-size:16px 16px;
}
a{color:inherit}

.wrap{max-width:1080px; margin:0 auto; padding:0 16px}

/* ---- header ---- */
header{position:sticky; top:0; z-index:30; background:var(--paper); border-bottom:var(--bd)}
.bar{display:flex; align-items:center; gap:12px; height:62px}

.bubble{position:relative; width:220px; padding:26px 20px; background:var(--pink); border:var(--bd); border-radius:50%/40%; box-shadow:var(--shadow); text-align:center; transform:rotate(4deg)}

section{padding:44px 0}

h4{font-size:1rem; font-weight:900; margin:20px 0 8px}

#bmForm input, #bmForm textarea{font:inherit; font-size:.95rem; padding:8px 10px; border:2px solid var(--ink); border-radius:10px; background:#fff; resize:vertical}
#bmForm .btn{align-self:flex-start}
.bm-status{margin:0; font-size:.88rem; font-weight:700; min-height:1.2em}

/* ---- floating donate card ---- */
.fc{position:fixed; right:18px; bottom:18px; z-index:40; width:250px; background:var(--paper); border:var(--bd); border-radius:16px; box-shadow:var(--shadow); transition:opacity .2s, transform .2s}
.fc.away{opacity:0; transform:translateY(12px); pointer-events:none}
.fc-head{display:flex; align-items:center; gap:6px; padding:8px 8px 8px 12px; background:var(--yellow); border-bottom:var(--bd); border-radius:13px 13px 0 0; cursor:grab; touch-action:none; user-select:none}
.fc.dragging .fc-head{cursor:grabbing}
.fc-grip{font-size:.9rem; letter-spacing:-2px; color:var(--ink-soft)}
.fc-head b{flex:1; font-size:.92rem; font-weight:900}
.fc-x{width:28px; height:28px; border:2px solid var(--ink); border-radius:50%; background:var(--paper); font:inherit; font-weight:900; font-size:.85rem; cursor:pointer; display:grid; place-items:center; padding:0}
.fc-x:hover{background:var(--red); color:#fff}
.fc-body{display:flex; align-items:center; gap:12px; padding:12px}
.fc-body img{width:88px; height:88px; border:2px solid var(--ink); border-radius:8px; padding:3px; background:#fff}
.fc-side{display:flex; flex-direction:column; gap:6px; min-width:0}
.fc-side small{font-size:.75rem; color:var(--ink-soft); line-height:1.4}
.fc-side .btn{padding:6px 12px; font-size:.88rem; justify-content:center}
.fc-mini{position:fixed; right:18px; bottom:18px; z-index:40; width:54px; height:54px; border:var(--bd); border-radius:50%; background:var(--yellow); box-shadow:var(--shadow-sm); font-size:1.5rem; cursor:pointer; display:grid; place-items:center; padding:0; transition:opacity .2s}
.fc-mini.away{opacity:0; pointer-events:none}
@media (hover:none), (max-width:640px){
  .fc{width:auto; max-width:calc(100vw - 28px); right:14px; bottom:14px}
  .fc-body img{display:none}   /* 手機上掃自己螢幕的 QR code 沒意義，只留按鈕 */
  .fc-side small{display:none}
  .fc-side{flex-direction:row}
  .fc-head{padding:6px 6px 6px 10px}
  .fc-body{padding:8px 10px}
}

/* 電腦版懸浮卡片：沒有 QR code，卡片大小不變，文字與按鈕依比例放大 */
@media (hover:hover) and (min-width:641px){
  .fc-body{padding:8px 12px 9px}
  .fc-side{width:100%; gap:7px}
  .fc-side small{font-size:.9rem; line-height:1.4; color:var(--ink)}
  .fc-side .btn{padding:6px 12px; font-size:1.05rem; line-height:1.3}
  .fc-side .btn svg{width:20px; height:20px}
}

/* ---- feedback ---- */
.fb{background:var(--paper); border:var(--bd); border-radius:20px; box-shadow:var(--shadow); padding:24px; max-width:760px}
.fb-types{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px}
.fb-type{display:flex; align-items:center; justify-content:center; gap:8px; padding:14px; font:inherit; font-size:1.05rem; font-weight:900; border:var(--bd); border-radius:14px; background:var(--paper); box-shadow:var(--shadow-sm); cursor:pointer; transition:transform .12s, box-shadow .12s, background .12s}
.fb-type:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink)}
.fb-type[aria-pressed="true"]{background:var(--blue); color:#fff}
.fb-type[data-type="font"][aria-pressed="true"]{background:var(--red)}
.fb-type[data-type="tool"][aria-pressed="true"]{background:var(--yellow); color:var(--ink)}
@media (max-width:560px){.fb-types{gap:8px}.fb-type{padding:12px 4px; font-size:.92rem; gap:4px; flex-wrap:wrap}}
.fb-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.fb-grid .full{grid-column:1/-1}
.fb label, .fb fieldset{display:flex; flex-direction:column; gap:5px; font-size:.86rem; font-weight:900; min-width:0}
.fb fieldset{border:0; padding:0; margin:0}
.fb legend{padding:0; margin-bottom:5px}
.fb select, .fb input, .fb textarea{font:inherit; font-size:.95rem; font-weight:400; padding:9px 11px; border:2px solid var(--ink); border-radius:10px; background:#fff; width:100%}
.fb textarea{resize:vertical; min-height:120px}
.fb .opt{font-weight:400; color:var(--ink-faint)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips label{flex-direction:row; align-items:center; gap:0; font-weight:700}
.chips input{position:absolute; opacity:0; width:1px; height:1px}
.chips span{display:inline-block; padding:5px 13px; border:2px solid var(--ink); border-radius:999px; background:#fff; cursor:pointer; font-size:.88rem}
.chips input:checked + span{background:var(--yellow); box-shadow:2px 2px 0 var(--ink)}
.chips input:focus-visible + span{outline:3px solid var(--blue); outline-offset:2px}
.fb-hint{font-size:.8rem; font-weight:400; color:var(--ink-soft); margin:0}
.fb-hp{position:absolute !important; left:-9999px !important; width:1px; height:1px; overflow:hidden}
.fb-foot{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:18px}
.fb-status{font-weight:700; font-size:.92rem; margin:0}
.fb-link{display:inline-block; font-size:.82rem; font-weight:700; color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px; margin-left:4px}
.fb-link:hover{color:var(--red-deep)}
.card-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
@media (max-width:640px){ .fb{padding:18px 14px} .fb-grid{grid-template-columns:1fr} }

/* ---- terms (footer) ---- */
.terms{max-width:820px; margin:0 auto 22px; text-align:left; background:var(--paper); border:var(--bd); border-radius:16px; box-shadow:var(--shadow-sm); padding:16px 18px}
.terms-short{margin:0; font-size:.9rem; color:var(--ink); line-height:1.6}
.terms-short b{background:var(--yellow); padding:0 4px}
.terms details{border-top:2px dashed var(--ink-faint); margin-top:12px; padding-top:10px}
.terms-full h5{font-size:.95rem; font-weight:900; margin:14px 0 4px}
.terms-full p, .terms-full li{font-size:.85rem; color:var(--ink-soft); margin:0 0 4px}
.terms-full ul{margin:0 0 4px; padding-left:1.3em}
/* ---- notice modals ---- */
.notice-body{padding:16px 18px 4px; font-size:.95rem}
.notice-body p{margin:0 0 10px}
.notice-body ul{margin:0 0 10px; padding-left:1.2em}
.notice-body li{margin-bottom:4px}
.notice-warn{background:var(--red-soft); border:2px solid var(--ink); border-radius:10px; padding:8px 12px; font-weight:900}
.modal-box.wide{width:min(560px,100%)}
.card-click{cursor:pointer}
.card{position:relative}
.card.off{background:#efece4; filter:grayscale(.85); opacity:.85}
.card.off:hover{transform:none; box-shadow:var(--shadow)}
.fix-badge{position:absolute; top:-10px; right:12px; padding:3px 11px; font-size:.78rem; font-weight:900; background:var(--yellow); color:var(--ink); border:var(--bd); border-radius:999px; box-shadow:var(--shadow-sm); filter:none}
.btn-fix[aria-disabled="true"]{background:var(--yellow); color:var(--ink); border-color:var(--ink); opacity:.9}
.modal-box.wide .notice-btns{position:sticky; bottom:0; background:var(--paper); border-top:var(--bd); padding-top:12px; border-radius:0 0 16px 16px}
.guide-body{padding:14px 18px 4px; font-size:.95rem}
.guide-lead{margin:0 0 12px; color:var(--ink-soft)}
.guide-steps{list-style:none; counter-reset:gs; margin:0; padding:0; display:grid; gap:16px}
.guide-steps li{counter-increment:gs; position:relative; padding-left:34px}
.guide-steps li::before{content:counter(gs); position:absolute; left:0; top:0; width:24px; height:24px; border:var(--bd); border-radius:50%; background:var(--yellow); font-weight:900; font-size:.85rem; display:grid; place-items:center}
.guide-steps p{margin:0 0 8px}
.guide-steps img{display:block; width:100%; max-width:360px; height:auto; border:var(--bd); border-radius:10px}
.guide-h{margin:18px 0 8px; font-size:1rem; font-weight:900; padding-left:10px; border-left:4px solid var(--ink)}
.guide-body > p:not(.guide-lead):not(.guide-tip){margin:0 0 8px}
.guide-list{margin:0; padding-left:1.2em; display:grid; gap:6px}
.guide-tip{margin:16px 0 4px; padding:10px 12px; background:var(--cream, #fbf3dd); border:1px dashed var(--ink-faint); border-radius:10px; font-size:.88rem; color:var(--ink-soft)}
.notice-btns{display:flex; flex-wrap:wrap; gap:10px; padding:6px 18px 18px}

footer{padding:36px 0 96px; text-align:center; font-size:.85rem; color:var(--ink-soft)}
footer a{color:var(--ink); font-weight:700}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top"><span class="logo">華</span><span data-i="brand"></span></a>
    <nav>
      <a href="#games" data-i="navGames"></a>
      <a href="#tools" data-i="navTools"></a>
      <a href="#font" data-i="navFont"></a>
      <a href="#feedback" data-i="navFeedback"></a>
      <a href="#subscribe" data-i="navSub"></a>
      <a href="#support" data-i="navSupport"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="es">ES</button>
    </div>
  </div>
</header>

<main id="top" class="wrap">

  <div class="hero">
    <div>
      <h1><span data-i="brand"></span></h1>
      <p class="sub" data-i="brandAlt"></p>
      <p class="tag" data-i="tagline"></p>
      <div class="ctas">
        <a class="btn btn-brick" href="#games" data-i="ctaGames"></a>
        <a class="btn btn-jade" href="#tools" data-i="ctaTools"></a>
        <a class="btn btn-line" href="#font" data-i="ctaFont"></a>
        <a class="btn" href="#subscribe" data-i="ctaSub"></a>
      </div>
    </div>
    <div class="bubble" aria-hidden="true"><b>你好！</b><small>¡Hola!</small></div>
  </div>

  <section id="games">
    <div class="sec-head"><span class="mark"></span><h2 data-i="gamesTitle"></h2></div>
    <p class="sec-intro" data-i="gamesIntro"></p>
    <div class="grid" id="gameGrid"></div>
  </section>

  <section id="tools">
    <div class="sec-head"><span class="mark" style="background:var(--yellow)"></span><h2 data-i="toolsTitle"></h2></div>
    <p class="sec-intro" data-i="toolsIntro"></p>
    <div class="grid" id="toolGrid"></div>
  </section>

  <section id="font">
    <div class="sec-head"><span class="mark"></span><h2 data-i="fontTitle"></h2></div>
    <p class="sec-intro" data-i="fontIntro"></p>
    <div class="font-grid">
      <div class="left-col">
        <div class="panel preview">
          <div class="sample">
            <span class="ph"><ruby>我<rt>wǒ</rt></ruby><ruby>不<rt>bú</rt></ruby><ruby>是<rt>shì</rt></ruby><ruby>老<rt>lǎo</rt></ruby><ruby>師<rt>shī</rt></ruby></span>
            <span class="ph"><ruby>一<rt>yì</rt></ruby><ruby>起<rt>qǐ</rt></ruby><ruby>學<rt>xué</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>文<rt>wén</rt></ruby></span>
          </div>
          <div class="meta" id="fontMeta"></div>
          <p class="font-desc" id="fontDesc"></p>
        </div>
        <!-- 讀音投票：項目由 stats.html 公開；沒有項目時整塊隱藏 -->
        <div class="panel vote" id="voteBox" hidden>
          <div class="vote-head"><h4 data-i="voteTitle"></h4><span id="voteHeadSlot"></span></div>
          <p class="vote-intro" data-i="voteIntro"></p>
          <div class="vote-list" id="voteList"></div>
          <p class="vote-status" id="voteStatus" role="status"></p>
        </div>
      </div>
      <div class="panel">
        <h4 data-i="dlTitle"></h4>
        <div class="dl-list" id="dlList"></div>
        <h4 data-i="reqTitle"></h4>
        <p class="req" id="fontReq"></p>
        <h4 data-i="stepsTitle"></h4>
        <ol class="steps" id="fontSteps"></ol>
        <span id="reportHome"><a class="report" id="reportLink" data-i="report"></a></span>
        <details>
          <summary data-i="logTitle"></summary>
          <ul class="log" id="fontLog"></ul>
        </details>
        <p class="license" id="fontLicense"></p>
      </div>
    </div>
  </section>

  <section id="feedback">
    <div class="sec-head"><span class="mark" style="background:var(--blue)"></span><h2 data-i="fbTitle"></h2></div>
    <p class="sec-intro" data-i="fbIntro"></p>
    <form class="fb" id="fbForm" novalidate>
      <div class="fb-types" role="group">
        <button type="button" class="fb-type" data-type="game" aria-pressed="true">🎮 <span data-i="fbGame"></span></button>
        <button type="button" class="fb-type" data-type="font" aria-pressed="false">🔤 <span data-i="fbFont"></span></button>
        <button type="button" class="fb-type" data-type="tool" aria-pressed="false">🛠️ <span data-i="fbTool"></span></button>
      </div>
      <div class="fb-grid">
        <label id="fbTargetWrap"><span id="fbTargetLabel"></span><select id="fbTarget"></select></label>
        <label id="fbAppWrap" hidden><span data-i="fbApp"></span><select id="fbApp"></select></label>
        <fieldset class="full"><legend data-i="fbKind"></legend><div class="chips" id="fbKinds"></div></fieldset>
        <label class="full"><span data-i="fbMsg"></span><textarea id="fbMsg" maxlength="2000" required></textarea>
          <p class="fb-hint" id="fbHint"></p></label>
        <label><span><span data-i="nameLabel"></span> <span class="opt" data-i="optional"></span></span><input id="fbName" maxlength="40" autocomplete="name"></label>
        <label><span><span data-i="fbContact"></span> <span class="opt" data-i="optional"></span></span><input id="fbContact" maxlength="100"></label>
        <!-- 陷阱欄位：真人看不到，機器人會填 -->
        <label class="fb-hp" aria-hidden="true">Website<input id="fbWebsite" tabindex="-1" autocomplete="off"></label>
      </div>
      <div class="fb-foot">
        <button type="submit" class="btn btn-brick" id="fbSend" data-i="fbSend"></button>
        <p class="fb-status" id="fbStatus" role="status"></p>
      </div>
    </form>
  </section>

  <section id="subscribe">
    <div class="sec-head"><span class="mark" style="background:var(--yellow)"></span><h2 data-i="subTitle"></h2></div>
    <p class="sec-intro" data-i="subIntro"></p>
    <div class="panel subbox" id="subPanel"></div>
    <div class="panel wa-box" id="waBox">
      <div><h3 data-i="waTitle"></h3><p data-i="waDesc"></p></div>
      <a class="btn btn-jade" id="waLink" href="https://wangchiapin.github.io/subscription/" target="_blank" rel="noopener"><span data-i="waBtn"></span> ▸</a>
      <span class="btn btn-fix" id="waFix" hidden aria-disabled="true">🔧 <span data-i="fixing"></span></span>
    </div>
  </section>

  <section id="support">
    <div class="support">
      <div class="sec-head"><span class="mark"></span><h2 data-i="supportTitle"></h2></div>
      <p class="sec-intro" data-i="supportIntro"></p>
      <div class="pay-grid" id="payGrid"></div>
    </div>
  </section>

</main>

<!-- 懸浮捐款卡片：可拖曳、可關閉；捲到下方「支持」區時自動隱藏 -->
<aside class="fc" id="fc" aria-labelledby="fcTitle">
  <div class="fc-head" id="fcHandle">
    <span class="fc-grip" aria-hidden="true">⋮⋮</span>
    <b id="fcTitle" data-i="supportTitle"></b>
    <button type="button" class="fc-x" id="fcClose" aria-label="close">✕</button>
  </div>
  <div id="fcBody"></div>
</aside>
<button type="button" class="fc-mini" id="fcMini" hidden aria-label="PayPal">☕</button>

<!-- 銀行轉帳彈出視窗：帳號從 Firebase 讀取 -->
<div class="modal" id="bankModal" hidden role="dialog" aria-modal="true" aria-labelledby="bmTitle">
  <div class="modal-box">
    <div class="modal-head"><b id="bmTitle" data-i="bankTitle"></b><button type="button" class="fc-x" id="bmClose" aria-label="close">✕</button></div>
    <div class="bm-info" id="bmInfo"></div>
    <form id="bmForm">
      <p class="bm-sub" data-i="noteIntro"></p>
      <label><span data-i="nameLabel"></span><input id="bmName" maxlength="40" autocomplete="name"></label>
      <label><span data-i="msgLabel"></span><textarea id="bmMsg" maxlength="500" rows="3"></textarea></label>
      <button type="submit" class="btn btn-brick" id="bmSend" data-i="sendNote"></button>
      <p class="bm-status" id="bmStatus" role="status"></p>
    </form>
  </div>
</div>

<!-- 進站提醒（同一台裝置只出現一次） -->
<div class="modal" id="welcomeModal" hidden role="dialog" aria-modal="true" aria-labelledby="wmTitle">
  <div class="modal-box">
    <div class="modal-head"><b id="wmTitle" data-i="wmTitle"></b></div>
    <div class="notice-body" id="wmBody"></div>
    <div class="notice-btns">
      <button type="button" class="btn btn-brick" id="wmOk" data-i="wmOk"></button>
      <button type="button" class="btn" id="wmMore" data-i="wmMore"></button>
    </div>
  </div>
</div>

<!-- 下載前確認（每次下載都會出現） -->
<div class="modal" id="dlModal" hidden role="dialog" aria-modal="true" aria-labelledby="dmTitle">
  <div class="modal-box">
    <div class="modal-head"><b id="dmTitle" data-i="dmTitle"></b><button type="button" class="fc-x" id="dmClose" aria-label="close">✕</button></div>
    <div class="notice-body" id="dmBody"></div>
    <div class="notice-btns">
      <button type="button" class="btn btn-jade" id="dmOk" data-i="dmOk"></button>
      <button type="button" class="btn" id="dmCancel" data-i="dmCancel"></button>
    </div>
  </div>
</div>

<!-- 小工具使用說明 -->
<div class="modal" id="toolGuide" hidden role="dialog" aria-modal="true" aria-labelledby="tgName">
  <div class="modal-box wide">
    <div class="modal-head"><b id="tgName"></b><button type="button" class="fc-x" id="tgClose" aria-label="close">✕</button></div>
    <div class="guide-body" id="tgBody"></div>
    <div class="notice-btns" id="tgBtns"></div>
  </div>
</div>

<!-- 開始玩／開啟工具之前的小提醒（每台裝置每天一次） -->
<div class="modal" id="gameModal" hidden role="dialog" aria-modal="true" aria-labelledby="gmTitle">
  <div class="modal-box">
    <div class="modal-head"><b id="gmTitle" data-i="gmTitle"></b><button type="button" class="fc-x" id="gmClose" aria-label="close">✕</button></div>
    <div class="notice-body" id="gmBody"></div>
    <div class="notice-btns">
      <button type="button" class="btn btn-brick" id="gmOk" data-i="gmOk"></button>
      <a class="btn btn-line" id="gmIg" target="_blank" rel="noopener" data-i="gmIg" hidden></a>
    </div>
  </div>
</div>

<footer>
  <div class="wrap">
    <div class="terms" id="terms">
      <p class="terms-short" id="termsShort"></p>
      <details id="termsDetails">
        <summary data-i="termsMore"></summary>
        <div class="terms-full" id="termsFull"></div>
      </details>
    </div>
    © <span id="year"></span> <span data-i="brand"></span> · <a id="handle" target="_blank" rel="noopener"></a>
  </div>
</footer>

<script>
/* ===== 介面固定文字（一般不用改） ===== */
const UI = {
  brand:      CONFIG.site.brand,
  brandAlt:   { zh: CONFIG.site.brand.es, es: CONFIG.site.brand.zh },
  tagline:    CONFIG.site.tagline,

  toolsTitle: { zh: "教學小工具", es: "Herramientas para enseñar" },

  gdLearn:    { zh: "練什麼", es: "Qué se practica" },

var STAT_QUEUE = [];

function isOwner(){ try { return localStorage.getItem("portal-owner") === "1"; } catch(e){ return false; } }
function track(field){
  if (isOwner()) return Promise.resolve();
  if (window.__statWrite) return window.__statWrite(field);
  STAT_QUEUE.push(field); return Promise.resolve();
}

  } catch(e){}
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-track]");
  if (!a) return;
  const p = track(a.dataset.track);
  // 下載連結會在同一頁跳轉，先等記錄送出（最多 1.2 秒）再下載，避免記錄被中斷
  if (!a.target && a.href && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
    e.preventDefault();
    const href = a.href;
    Promise.race([p, new Promise(r => setTimeout(r, 1200))]).finally(() => { location.href = href; });
  }
});

(function floatCard(){
  const fc = document.getElementById("fc"), mini = document.getElementById("fcMini");
  const handle = document.getElementById("fcHandle");
  if (!CONFIG.support.length) { fc.hidden = true; return; }

  // 關閉 → 變成右下角的 ☕ 小圓鈕；點小圓鈕再打開（回到右下角）
  document.getElementById("fcClose").addEventListener("click", () => { fc.hidden = true; mini.hidden = false; });
  mini.addEventListener("click", () => {
    fc.style.left = fc.style.top = ""; fc.style.right = fc.style.bottom = "";
    fc.hidden = false; mini.hidden = true;
  });

  // 拖曳（按住黃色標題列）；不記位置，重新整理會回到右下角
  let sx, sy, ox, oy, moving = false;
  handle.addEventListener("pointerdown", e => {
    if (e.target.closest(".fc-x")) return;
    const r = fc.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; moving = true;
    fc.classList.add("dragging"); handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener("pointermove", e => {
    if (!moving) return;
    const w = fc.offsetWidth, h = fc.offsetHeight;
    const x = Math.min(Math.max(4, ox + e.clientX - sx), innerWidth - w - 4);
    const y = Math.min(Math.max(66, oy + e.clientY - sy), innerHeight - h - 4);
    fc.style.left = x + "px"; fc.style.top = y + "px"; fc.style.right = "auto"; fc.style.bottom = "auto";
  });
  const stop = () => { moving = false; fc.classList.remove("dragging"); };
  handle.addEventListener("pointerup", stop); handle.addEventListener("pointercancel", stop);
  addEventListener("resize", () => {   // 視窗縮小時避免卡片跑出畫面
    if (!fc.style.left) return;
    const r = fc.getBoundingClientRect();
    if (r.right > innerWidth || r.bottom > innerHeight) { fc.style.left = fc.style.top = ""; fc.style.right = fc.style.bottom = ""; }
  });

  // 捲到下方「支持」區時先隱藏，避免重複
  if ("IntersectionObserver" in window) {
    // 捲到「支持」區或頁尾的使用說明時隱藏，避免重複或擋住文字
    const seen = new Set();
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => en.isIntersecting ? seen.add(en.target) : seen.delete(en.target));
      const away = seen.size > 0;
      fc.classList.toggle("away", away); mini.classList.toggle("away", away);
    }, { threshold: 0.15 });
    io.observe(document.getElementById("support")); io.observe(document.getElementById("terms"));
  }
})();

(function bankModal(){
  const modal = document.getElementById("bankModal"), info = document.getElementById("bmInfo");
  const form = document.getElementById("bmForm"), status = document.getElementById("bmStatus");
  let bankCache = null;
  const close = () => { modal.hidden = true; };
  document.getElementById("bmClose").addEventListener("click", close);
  modal.addEventListener("click", e => { if (e.target === modal) close(); });
  addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) close(); });

  function showInfo(b){
    const row = (label, val, cls, copy) => val ? `<div class="bm-row ${cls||""}"><span>${esc(label)}</span><b>${esc(val)}</b>${copy ? `<button type="button" class="bm-copy" data-copy="${esc(val)}">${esc(t(UI.copy))}</button>` : ""}</div>` : "";
    info.innerHTML =
      row(t(UI.bankName), [b.bankName, b.bankCode && `(${b.bankCode})`].filter(Boolean).join(" ")) +
      row(t(UI.bankAcct), b.account, "acct", true) +
      row(t(UI.bankHolder), b.holder) +
      `<p class="bm-warn">${esc(t(UI.bankWarn))}</p>`;
  }
  info.addEventListener("click", async e => {
    const btn = e.target.closest("[data-copy]"); if (!btn) return;
    try { await navigator.clipboard.writeText(btn.dataset.copy.replace(/[^0-9]/g, "") || btn.dataset.copy); btn.textContent = t(UI.copied); }
    catch(err){ /* 不支援複製就算了 */ }
  });

  document.addEventListener("click", async e => {
    if (!e.target.closest("[data-bank]")) return;
    modal.hidden = false; status.textContent = "";
    if (bankCache) { showInfo(bankCache); return; }
    info.innerHTML = `<p class="bm-msg">${esc(t(UI.bankLoading))}</p>`;
    try {
      for (let i = 0; i < 30 && !window.__getBank; i++) await new Promise(r => setTimeout(r, 100));  // 等 Firebase 載入
      const b = window.__getBank && await window.__getBank();
      if (!b || !b.account) throw new Error("no data");
      bankCache = b; showInfo(b);
    } catch(err) { info.innerHTML = `<p class="bm-msg">${esc(t(UI.bankError))}</p>`; }
  });

  form.addEventListener("submit", async e => {

function readShot(file){
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type) || file.size > 15e6) return rej(new Error("bad"));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => rej(new Error("bad")); img.src = url;
  });
}

    <tbody>${CMP_ROWS.map(r => `<tr><th scope="row">${esc(t(r[0]))}</th><td>${esc(t(r[1]))}</td><td>${esc(t(r[2]))}</td></tr>`).join("")}</tbody></table>
    <p class="cmp-sum">${esc(t(UI.cmpSum))}</p>`;
}
const goCenterBtn = () => `<a class="btn btn-jade" href="${CENTER_URL}" target="_blank" rel="noopener">${esc(t(UI.cmpGo))} ▸</a>`;
function renderSub(){
  const box = document.getElementById("subPanel"); if (!box) return;
  const head = `<h3>${esc(t(UI.cardTitle))}</h3>`;
  if (isOff("sub-site")) { box.innerHTML = `${head}<p class="sub-msg">🔧 ${esc(t(UI.fixing))}</p>`; return; }
  if (!SUBST.ready) { box.innerHTML = `${head}${compareHtml()}<p class="sub-msg">${esc(t(UI.subLoading))}</p>`; return; }
  const f = SUBST.form, u = SUBST.user;
  const prices = `<h3 class="sub-sec">${esc(t(UI.priceTitle))}</h3><div class="sub-prices">${["month", "year"].map(pl => `<div class="sub-price"><b>${esc(planLabel(pl))}</b>
      <div>${esc(fmtMoney(subPrice(pl, "TWD"), "TWD"))}　/　${esc(fmtMoney(subPrice(pl, "USD"), "USD"))}</div></div>`).join("")}</div>`;
  if (!u) {
    box.innerHTML = `${head}${compareHtml()}${prices}<p class="sub-msg">${esc(t(UI.subLoginHint))}</p>
      <div class="row"><button type="button" class="btn btn-brick" data-sub="login">${esc(t(UI.subLogin))}</button></div>
      ${SUBST.msg ? `<p class="sub-msg">${esc(SUBST.msg)}</p>` : ""}`;
    return;
  }
  const active = subActive(), p = SUBST.plan;
  const state = active
    ? `<div class="sub-state on">✓ ${esc(t(UI.subActive))}：${esc(planLabel(p.plan))}　${esc(t(UI.subUntil))} ${esc(fmtDay(p.expiresAt))}</div>`
    : `<div class="sub-state">${esc(p && p.expiresAt && p.plan !== "free" ? t(UI.subExpired) : t(UI.subFree))}</div>`;
  const m = SUB_METHODS.find(x => x.id === f.method) || SUB_METHODS[0];
  const price = m.contact && m.cur === "MXN" ? null : subPrice(f.plan, m.cur);
  const priceOk = m.contact || price != null;
  const canSend = subCanSend();
  const igUrl = CONFIG.site.handleUrl || "";
  const pp = CONFIG.support.find(x => x.id === "paypal");
  let pay = "";
  if (m.id === "paypal") pay = `<p>${esc(t(UI.subPayPaypal))}</p><p><b>${esc(t(UI.subAmount))}：${esc(fmtMoney(price, "USD"))}</b></p>${pp && pp.url ? `<a class="btn btn-jade" href="${esc(pp.url)}" target="_blank" rel="noopener">PayPal ▸</a>` : ""}`;
  else if (m.id === "twd") pay = `<p>${esc(t(UI.subPayBank))}</p><p><b>${esc(t(UI.subAmount))}：${esc(fmtMoney(price, "TWD"))}</b></p><button type="button" class="btn btn-bank" data-bank>${esc(t(UI.showBank))}</button>`;
  else pay = `<p>${esc(t(UI.subPayContact))}</p>${igUrl ? `<a class="btn btn-line" href="${esc(igUrl)}" target="_blank" rel="noopener">${esc(t(UI.subContact))} ▸</a>` : ""}`;
  const reqs = SUBST.requests.length ? `<div><b>${esc(t(UI.subMine))}</b>${SUBST.requests.map(r => `<div class="sub-req"><span>${esc(r.when)}</span><span>${esc(planLabel(r.plan))}</span><span>${esc((SUB_METHODS.find(x => x.id === r.method) || { label: { zh: r.method, es: r.method } }).label[lang] || r.method)}</span><b>${esc(t(r.status === "approved" ? UI.reqApproved : r.status === "rejected" ? UI.reqRejected : UI.reqPending))}</b></div>`).join("")}</div>` : "";
  const form = `<label><span>${esc(t(UI.subPlanLabel))}</span><select data-sub-field="plan">${["month", "year"].map(pl => `<option value="${pl}" ${f.plan === pl ? "selected" : ""}>${esc(planLabel(pl))}</option>`).join("")}</select></label>
    <label><span>${esc(t(UI.subMethodLabel))}</span><select data-sub-field="method">${SUB_METHODS.map(x => `<option value="${x.id}" ${f.method === x.id ? "selected" : ""}>${esc(t(x.label))}</option>`).join("")}</select></label>
    <div class="sub-pay">${pay}</div>
    <label><span>${esc(t(m.id === "paypal" ? UI.subRefPaypal : m.id === "twd" ? UI.subRefTwd : UI.subRefOther))}</span><input type="text" data-sub-field="ref" maxlength="80" autocomplete="off" ${m.id === "twd" ? 'inputmode="numeric"' : ""} value="${esc(f.ref)}"></label>
    <label><span>${esc(t(UI.subPaidAt))}</span><input type="datetime-local" data-sub-field="paidAt" value="${esc(f.paidAt)}"></label>
    ${SITE_NOTIFY_URL ? `<div><span style="font-size:.86rem;font-weight:900">${esc(t(UI.subShot))}</span>
      <div class="row" style="margin-top:6px"><label class="btn btn-line" style="cursor:pointer">${esc(t(UI.subShotPick))}<input type="file" accept="image/*" data-sub-shot hidden></label>
      ${f.shot ? `<img src="${f.shot}" alt="" style="height:56px;border:2px solid var(--ink);border-radius:8px"><span>${esc(f.shotName)}</span><button type="button" class="btn" data-sub="shotdel">${esc(t(UI.subShotDel))}</button>` : ""}</div></div>` : ""}
    <label><span>${esc(t(UI.subNoteLabel))}</span><textarea maxlength="300" data-sub-field="note">${esc(f.note)}</textarea></label>
    <label style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" data-sub-field="ok" ${f.ok ? "checked" : ""} style="width:auto"><span>${esc(t(UI.subConfirm))}</span></label>
    ${priceOk ? "" : `<p class="sub-msg">${esc(t(UI.subNoPrice))}</p>`}
    <div class="row"><button type="button" class="btn btn-brick" id="subSendBtn" data-sub="send" ${canSend && !SUBST.sending ? "" : "disabled"}>${esc(t(SUBST.sending ? UI.subSending : UI.subSend))}</button></div>
    `;
  box.innerHTML = `${head}${compareHtml()}${prices}
    <div class="row"><span>${esc(u.email)}</span><button type="button" class="btn" data-sub="logout">${esc(t(UI.subLogout))}</button></div>
    ${state}
    <div class="row">${goCenterBtn()}${active ? "" : `<span>${esc(t(UI.freeGoHint))}</span>`}</div>
    ${active ? `<details class="sub-renew" ${SUBST.renewOpen ? "open" : ""}><summary>${esc(t(UI.renewTitle))}</summary>${form}</details>` : form}
    ${SUBST.msg ? `<p class="sub-msg">${esc(SUBST.msg)}</p>` : ""}${reqs}`;
  const rd = box.querySelector(".sub-renew"); if (rd) rd.addEventListener("toggle", () => { SUBST.renewOpen = rd.open; });
}
async function refreshSubMe(){
  try {
    await window.__sub.ensureMember();
    SUBST.plan = await window.__sub.getPlan();
    SUBST.requests = (await window.__sub.myRequests()).map(r => ({ ...r, when: r.ts ? fmtDay(r.ts) : "" }));
  } catch (err) { console.warn("sub", err.code || err); SUBST.msg = t(UI.subOffline); }
  renderSub(); render();
}
window.initSub = function(){
  SUBST.ready = true; renderSub();
  window.__sub.getCatalog().then(c => { SUBITEMS = c; render(); }).catch(err => console.warn("catalog", err.code));
  window.__sub.getPricing().then(pr => { SUBST.pricing = pr; renderSub(); }).catch(err => console.warn("pricing", err.code));
  window.__sub.onChange(u => {
    SUBST.user = u ? { uid: u.uid, email: u.email || "" } : null; SUBST.plan = null; SUBST.requests = []; SUBST.msg = "";
    renderSub();
    if (u) refreshSubMe(); else render();
  });
};
document.getElementById("subPanel").addEventListener("click", async e => {
  const b = e.target.closest("[data-sub]"); if (!b) return;
  try {
    if (b.dataset.sub === "login") { SUBST.msg = ""; await window.__sub.login(); }
    else if (b.dataset.sub === "logout") { await window.__sub.logout(); }
    else if (b.dataset.sub === "shotdel") { SUBST.form.shot = null; SUBST.form.shotName = ""; renderSub(); }
    else if (b.dataset.sub === "send") {
      const f = SUBST.form, m = SUB_METHODS.find(x => x.id === f.method);
      if (!subCanSend()) return;
      SUBST.sending = true; SUBST.msg = ""; renderSub();
      const req = { plan: f.plan, method: f.method, currency: m.cur, note: (f.note || "").slice(0, 300), ref: (f.ref || "").trim(), paidAt: f.paidAt || "" };
      const docRef = await window.__sub.sendRequest(req);
      const sent = await notifySite(req, docRef.id);
      SUBST.sending = false; Object.assign(f, { note: "", ref: "", paidAt: "", ok: false, shot: null, shotName: "" });
      SUBST.msg = t(UI.subSent) + " " + t(UI.subRefNo) + "：" + docRef.id.slice(0, 8).toUpperCase() + (SITE_NOTIFY_URL ? " " + t(sent ? UI.subNotified : UI.subNotifyFail) : "");
      SUBST.requests = (await window.__sub.myRequests()).map(r => ({ ...r, when: r.ts ? fmtDay(r.ts) : "" }));
      renderSub();
    }
  } catch (err) { console.warn("sub", err.code || err); SUBST.sending = false; SUBST.msg = b.dataset.sub === "send" ? t(UI.subFail) : (err.code === "auth/popup-closed-by-user" ? "" : String(err.code || "")); renderSub(); }
});
document.getElementById("subPanel").addEventListener("change", async e => {
  const shot = e.target.closest("[data-sub-shot]");
  if (shot) {
    try { SUBST.form.shot = await readShot(shot.files[0]); SUBST.form.shotName = shot.files[0].name; SUBST.msg = ""; }
    catch (err) { SUBST.form.shot = null; SUBST.form.shotName = ""; SUBST.msg = t(UI.subShotErr); }
    renderSub(); return;
  }
  const el = e.target.closest("[data-sub-field]"); if (!el) return;
  const k = el.dataset.subField;
  if (k === "plan" || k === "method") { SUBST.form[k] = el.value; SUBST.msg = ""; renderSub(); }
  else if (k === "ok") { SUBST.form.ok = el.checked; syncSend(); }
});
document.getElementById("subPanel").addEventListener("input", e => {
  const el = e.target.closest("[data-sub-field]"); if (!el) return;
  const k = el.dataset.subField;
  if (k === "note" || k === "ref" || k === "paidAt") { SUBST.form[k] = el.value; syncSend(); }
});

<script src="firebase-config.js"></script>
<script type="module">
/* Firebase 統計：沒填 firebase-config.js 時自動略過，不影響網頁 */
try {
  const cfg = window.FIREBASE_CONFIG;
  if (cfg && cfg.projectId) {
    const V = "10.12.2";
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const { initializeFirestore, doc, setDoc, getDoc, addDoc, collection, increment, serverTimestamp, getDocs, query, where, documentId } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    // 用「長輪詢」連線：在手機網路、部分瀏覽器上比較不會卡住
    const papp = initializeApp(cfg, "portal");
    const db = initializeFirestore(papp, { experimentalForceLongPolling: true });
    const auth = getAuth(papp);
    window.__statWrite = field => Promise.all(
      ["total", "d_" + todayTW()].map(id =>
        setDoc(doc(db, "portalStats", id + "__" + field), { n: increment(1) }, { merge: true })
          .catch(err => console.warn("stat", id, field, err.code))
      )
    );
    STAT_QUEUE.splice(0).forEach(window.__statWrite);
    // 銀行帳號（存在 portalPublic/bank）與留言（存到 portalNotes，只有你登入後看得到）
    window.__getBank = async () => { const d = await getDoc(doc(db, "portalPublic", "bank")); return d.exists() ? d.data() : null; };
    window.__sendNote = (name, message, lang) =>
      addDoc(collection(db, "portalNotes"), { name, message, lang, createdAt: serverTimestamp() });
    // 回饋（存到 portalFeedback，只有你登入後看得到）
    window.__sendFeedback = data => addDoc(collection(db, "portalFeedback"), { ...data, createdAt: serverTimestamp() });
    // 讀音投票：項目在 portalVotes（公開可讀），票數在 portalVoteCount/項目ID__agree|disagree（欄位 n）
    window.__getVotes = async () => {
      const snap = await getDocs(query(collection(db, "portalVotes"), where("active", "==", true)));
      const items = snap.docs.map(d => { const x = d.data();
        return { id: d.id, word: x.word || "", current: x.current || "", suggested: x.suggested || "", note: x.note || "",
                 ts: x.createdAt && x.createdAt.toMillis ? x.createdAt.toMillis() : 0, agree: 0, disagree: 0 }; });
      const byId = Object.fromEntries(items.map(i => [i.id, i]));
      const ids = items.flatMap(i => [i.id + "__agree", i.id + "__disagree"]);
      for (let i = 0; i < ids.length; i += 30) {          // Firestore 的 in 查詢一次最多 30 個
        const cs = await getDocs(query(collection(db, "portalVoteCount"), where(documentId(), "in", ids.slice(i, i + 30))));
        cs.forEach(c => { const [id, k] = c.id.split("__"); if (byId[id]) byId[id][k] = c.data().n || 0; });
      }
      return items.sort((a, b) => b.ts - a.ts);
    };
    // 卡片開關：portalStatus 裡 off:true 的項目 = 維修中；讀取失敗就當作全部開啟
    window.__getStatus = async () => (await getDocs(query(collection(db, "portalStatus")))).docs.filter(d => d.data().off === true).map(d => d.id);
    window.__getStatus().then(ids => { if (ids.length) { OFF = new Set(ids); render(); } }).catch(err => console.warn("status", err.code));
    window.__sendVote = (id, choice) =>
      setDoc(doc(db, "portalVoteCount", id + "__" + choice), { n: increment(1) }, { merge: true });
    // 訂閱：會員資料 site_members、方案 site_plans（只有管理員能寫）、申請 site_requests、目錄 site_catalog、價格 site_config/pricing
    const tms = t => t && t.toMillis ? t.toMillis() : null;
    window.__sub = {
      onChange: fn => onAuthStateChanged(auth, fn),
      login: () => signInWithPopup(auth, new GoogleAuthProvider()),
      logout: () => signOut(auth),
      async ensureMember(){
        const u = auth.currentUser, ref = doc(db, "site_members", u.uid);
        if (!(await getDoc(ref)).exists()) await setDoc(ref, { email: u.email || "", name: u.displayName || "", createdAt: serverTimestamp() });
      },
      async getPlan(){
        const s = await getDoc(doc(db, "site_plans", auth.currentUser.uid));
        if (!s.exists()) return { plan: "free", startAt: null, expiresAt: null };
        const x = s.data(); return { plan: x.plan || "free", startAt: tms(x.startAt), expiresAt: tms(x.expiresAt) };
      },
      async getCatalog(){
        const snap = await getDocs(query(collection(db, "site_catalog")));
        const o = {}; snap.forEach(d => { if (d.data().access === "sub") o[d.id] = true; }); return o;
      },
      async getPricing(){ const s = await getDoc(doc(db, "site_config", "pricing")); return s.exists() ? s.data() : null; },
      sendRequest: ({ plan, method, currency, note, ref, paidAt }) => addDoc(collection(db, "site_requests"),
        { uid: auth.currentUser.uid, plan, method, currency, note, ref, ...(paidAt ? { paidAt } : {}), status: "pending", createdAt: serverTimestamp() }),
      async myRequests(){
        const snap = await getDocs(query(collection(db, "site_requests"), where("uid", "==", auth.currentUser.uid)));
        return snap.docs.map(d => { const x = d.data(); return { id: d.id, plan: x.plan, method: x.method, status: x.status, ts: tms(x.createdAt) || Date.now() }; }).sort((a, b) => b.ts - a.ts);
      }
    };
    if (window.initSub) window.initSub();
  }
} catch (e) { console.warn("stats off", e); }
</script>
