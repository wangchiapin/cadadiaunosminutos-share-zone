<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>網站統計</title>
<style>
:root{--cream:#f5eddc;--paper:#fbf7ee;--line:#e2d5bc;--ink:#2a231e;--soft:#6b6056;--brick:#a63d2f;--jade:#3c7c66;--gold:#b98b2c}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--cream);color:var(--ink)}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:1.5rem;margin:0 0 4px}
h2{font-size:1.1rem;margin:34px 0 10px;padding-left:10px;border-left:4px solid var(--brick)}
p.note{color:var(--soft);font-size:.88rem;margin:0 0 14px}
.owner{display:flex;gap:8px;align-items:center;font-size:.9rem;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:14px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile small{color:var(--soft);font-size:.8rem;display:block}
.tile b{font-size:1.8rem;line-height:1.2;display:block}
.tile span{font-size:.78rem;color:var(--soft)}
.tile.j{background:var(--jade);border-color:var(--jade);color:#fff}
.tile.j small,.tile.j span{color:#d7ebe3}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:7px 6px;text-align:right;white-space:nowrap}
th{font-size:.78rem;color:var(--soft);font-weight:700;border-bottom:1px solid var(--line)}
td{border-top:1px dashed var(--line)}
th:first-child,td:first-child{text-align:left}
tr:first-child td{border-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;flex:1;min-width:140px}
button{font:inherit;font-weight:700;padding:8px 16px;border:0;border-radius:8px;background:var(--brick);color:#fff;cursor:pointer}
.rel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.rel h3{font-size:.98rem;margin:0 0 4px}
.rel small{color:var(--soft)}
.msg{color:var(--soft);font-size:.9rem}
.note{padding:10px 0;border-top:1px dashed var(--line)}
.note:first-of-type{border-top:0}
.note b{font-size:.95rem}
.note small{color:var(--soft);font-size:.78rem;margin-left:6px}
.note p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.fb-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.fb-bar button{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:.82rem;padding:4px 10px}
.fb-bar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fb-bar .sp{flex:1}
.fbi{padding:12px 0;border-top:1px dashed var(--line)}
.fbi.done{opacity:.45}
.fbi .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:#eee;margin-right:4px}
.fbi .tag.font{background:#ffe1dc}.fbi .tag.game{background:#dfe8ff}.fbi .tag.pinyin{background:#ffd23f}
.fbi p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.fbi small{color:var(--soft);font-size:.78rem}
.fbi .acts{float:right;display:flex;gap:6px}
.fbi .acts button{font-size:.75rem;padding:2px 8px;background:#fff;color:var(--ink);border:1px solid var(--line)}
.note .del{float:right;font-size:.75rem;padding:2px 8px;background:#fff;color:var(--brick);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <h1>網站統計</h1>
  <p class="note">瀏覽和點擊次數來自 Firebase；字體實際下載次數來自 GitHub Releases。日期以台灣時間計算。</p>

  <label class="owner"><input type="checkbox" id="owner"> 這台裝置的瀏覽不計入統計（你自己的電腦、手機各勾一次）</label>

  <h2>總計</h2>
  <div class="tiles" id="tiles"><p class="msg">讀取中…</p></div>

  <h2>最近 30 天</h2>
  <div class="box" id="days"><p class="msg">讀取中…</p></div>

  <h2>各項點擊（總計）</h2>
  <div class="box" id="clicks"><p class="msg">讀取中…</p></div>

  <h2>留言（只有你登入後看得到）</h2>
  <div class="box" id="notes">
    <p class="msg">請用你的 Google 帳號登入才能看到留言。</p>
    <div class="row" style="margin:8px 0 10px"><button id="login">用 Google 登入</button></div>
  </div>

  <h2>回饋專區（只有你登入後看得到）</h2>
  <div class="box" id="fbBox"><p class="msg">請先在上方「留言」區用 Google 登入。</p></div>

  <h2>字體實際下載（GitHub Releases）</h2>
  <div class="row">
    <input type="text" id="repo" value="wangchiapin/GoodTeacher" aria-label="repo">
    <button id="go">更新</button>
  </div>
  <div id="out"></div>
</div>

<script>
/* ---- 自己的裝置不計入 ---- */
const ownerBox = document.getElementById("owner");
try { ownerBox.checked = localStorage.getItem("portal-owner") === "1"; } catch(e){}
ownerBox.addEventListener("change", () => {
  try { ownerBox.checked ? localStorage.setItem("portal-owner","1") : localStorage.removeItem("portal-owner"); } catch(e){}
});

const n = v => (v || 0).toLocaleString();

/* ---- GitHub Releases ---- */
const out = document.getElementById("out");
async function loadReleases(){
  const repo = document.getElementById("repo").value.trim();
  out.innerHTML = '<p class="msg">讀取中…</p>';
  try{
    const r = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=100`);
    if (!r.ok) throw new Error(r.status === 404 ? "找不到這個 repo（要是公開的，並且已經發布過 Release）" : "GitHub 回應 " + r.status);
    const rels = await r.json();
    if (!rels.length){ out.innerHTML = '<p class="msg">這個 repo 還沒有任何 Release。</p>'; return; }
    let total = 0;
    const html = rels.map(rel => {
      const sum = rel.assets.reduce((a, x) => a + x.download_count, 0);
      total += sum;
      const rows = rel.assets.map(x => `<tr><td>${x.name}</td><td>${n(x.download_count)}</td></tr>`).join("");
      return `<div class="rel"><h3>${rel.name || rel.tag_name} · ${n(sum)} 次</h3>
        <small>發布於 ${new Date(rel.published_at).toLocaleDateString("zh-TW")}</small><table>${rows}</table></div>`;
    }).join("");
    out.innerHTML = `<div class="tiles" style="margin-bottom:10px"><div class="tile j"><small>全部版本總下載</small><b>${n(total)}</b></div></div>` + html;
  }catch(e){ out.innerHTML = `<p class="msg">讀取失敗：${e.message}</p>`; }
}
document.getElementById("go").addEventListener("click", loadReleases);
loadReleases();
</script>

<script src="firebase-config.js"></script>
<script type="module">
const tiles = document.getElementById("tiles"), days = document.getElementById("days"), clicks = document.getElementById("clicks");
const fail = msg => { for (const el of [tiles, days, clicks]) el.innerHTML = `<p class="msg">${msg}</p>`; };
const n = v => (v || 0).toLocaleString();
const sumPrefix = (o, p) => Object.keys(o).filter(k => k.startsWith(p + "_")).reduce((a,k) => a + (o[k]||0), 0);

try {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.projectId) {
    fail("還沒設定 Firebase：請在 firebase-config.js 貼上設定。");
  } else {
    const V = "10.12.2";
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const { getFirestore, collection, getDocs, query, where, documentId } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app = initializeApp(cfg, "stats");
    const db = getFirestore(app);

    /* ---- 留言：需要用你的 Google 帳號登入（Firestore 規則只允許你讀取） ---- */
    (async () => {
      const notesBox = document.getElementById("notes");
      const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
      try {
        const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } =
          await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
        const { orderBy, limit, deleteDoc, doc } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
        const auth = getAuth(app);
        const loginUI = () => {
          notesBox.innerHTML = `<p class="msg">請用你的 Google 帳號登入才能看到留言。</p><div class="row" style="margin:8px 0 10px"><button id="login">用 Google 登入</button></div>`;
          document.getElementById("login").onclick = () => signInWithPopup(auth, new GoogleAuthProvider())
            .catch(err => { notesBox.insertAdjacentHTML("beforeend", `<p class="msg">登入失敗：${esc(err.code)}</p>`); });
        };
        async function loadNotes(user){
          notesBox.innerHTML = `<p class="msg">讀取中…（${esc(user.email)}）</p>`;
          try {
            const snap = await getDocs(query(collection(db, "portalNotes"), orderBy("createdAt", "desc"), limit(200)));
            const list = snap.docs.map(d => {
              const x = d.data(), when = x.createdAt ? x.createdAt.toDate().toLocaleString("zh-TW", { hour12: false }) : "";
              return `<div class="note"><button class="del" data-id="${esc(d.id)}">刪除</button><b>${esc(x.name || "（沒留名字）")}</b><small>${esc(when)} · ${x.lang === "es" ? "西文" : "中文"}</small>${x.message ? `<p>${esc(x.message)}</p>` : ""}</div>`;
            }).join("");
            notesBox.innerHTML = `<div class="row" style="justify-content:space-between;align-items:center;margin:8px 0"><span class="msg">共 ${snap.size} 則 · ${esc(user.email)}</span><button id="logout">登出</button></div>` +
              (list || `<p class="msg">還沒有留言。</p>`);
            document.getElementById("logout").onclick = () => signOut(auth);
            notesBox.querySelectorAll(".del").forEach(b => b.onclick = async () => {
              if (!confirm("確定要刪除這則留言？")) return;
              await deleteDoc(doc(db, "portalNotes", b.dataset.id)); loadNotes(user);
            });
          } catch (err) {
            notesBox.innerHTML = `<p class="msg">讀不到留言（${esc(err.code || err.message)}）。請確認登入的是你的帳號，以及 Firestore 規則已更新。</p><div class="row" style="margin:8px 0"><button id="logout">登出</button></div>`;
            document.getElementById("logout").onclick = () => signOut(auth);
          }
        }
        /* ---- 回饋專區 ---- */
        const fbBox = document.getElementById("fbBox");
        const { updateDoc } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
        const NAME = {
          game: "遊戲", font: "字體", site: "整個網站",
          wenkai: "文楷", kai: "正楷", zhuyin: "注音", ppt: "PPT 增益集",
          word: "Word", other: "其他",
          suggest: "建議", bug: "問題回報", thoughts: "心得", pinyin: "讀音錯誤", install: "安裝問題"
        };
        const nm = k => NAME[k] || k || "";
        let FBALL = [], fbFilter = "all";
        const FILTERS = [["all","全部"],["open","未處理"],["game","遊戲"],["font","字體"],["pinyin","讀音錯誤"]];
        const pass = x => fbFilter === "all" || (fbFilter === "open" ? !x.done : fbFilter === "pinyin" ? x.kind === "pinyin" : x.type === fbFilter);
        function drawFb(){
          const list = FBALL.filter(pass);
          fbBox.innerHTML = `<div class="fb-bar">${FILTERS.map(([k,l]) => `<button data-f="${k}" class="${k===fbFilter?"on":""}">${l}</button>`).join("")}
              <span class="sp"></span><button id="fbCsv">匯出 CSV（目前篩選）</button></div>` +
            (list.length ? list.map(x => `<div class="fbi ${x.done ? "done" : ""}">
              <span class="acts"><button data-done="${esc(x.id)}">${x.done ? "改回未處理" : "✓ 已處理"}</button><button data-del="${esc(x.id)}">刪除</button></span>
              <span class="tag ${esc(x.type)}">${esc(nm(x.type))}</span><span class="tag ${x.kind==="pinyin"?"pinyin":""}">${esc(nm(x.kind))}</span>
              <b>${esc(nm(x.target))}</b>${x.app ? ` · ${esc(nm(x.app))}` : ""}
              <br><small>${esc(x.when)} · ${esc(x.name || "（沒留名字）")}${x.contact ? " · 聯絡：" + esc(x.contact) : ""} · ${x.lang === "es" ? "西文" : "中文"}</small>
              <p>${esc(x.message)}</p></div>`).join("") : `<p class="msg">沒有符合的回饋。</p>`);
          fbBox.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { fbFilter = b.dataset.f; drawFb(); });
          fbBox.querySelectorAll("[data-done]").forEach(b => b.onclick = async () => {
            const x = FBALL.find(y => y.id === b.dataset.done);
            await updateDoc(doc(db, "portalFeedback", x.id), { done: !x.done }); x.done = !x.done; drawFb();
          });
          fbBox.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
            if (!confirm("確定要刪除這則回饋？")) return;
            await deleteDoc(doc(db, "portalFeedback", b.dataset.del)); FBALL = FBALL.filter(y => y.id !== b.dataset.del); drawFb();
          });
          document.getElementById("fbCsv").onclick = () => {
            const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
            const rows = [["時間","類別","對象","使用環境","類型","內容","名字","聯絡方式","語言","已處理"]]
              .concat(list.map(x => [x.when, nm(x.type), nm(x.target), nm(x.app), nm(x.kind), x.message, x.name, x.contact, x.lang, x.done ? "是" : ""]));
            const blob = new Blob(["\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
            a.download = `回饋-${fbFilter}-${new Date().toISOString().slice(0,10)}.csv`; a.click();
          };
        }
        async function loadFeedback(){
          fbBox.innerHTML = `<p class="msg">讀取中…</p>`;
          try {
            const snap = await getDocs(query(collection(db, "portalFeedback"), orderBy("createdAt", "desc"), limit(500)));
            FBALL = snap.docs.map(d => { const x = d.data(); return { id: d.id, ...x,
              when: x.createdAt ? x.createdAt.toDate().toLocaleString("zh-TW", { hour12: false }) : "" }; });
            drawFb();
          } catch (err) {
            fbBox.innerHTML = `<p class="msg">讀不到回饋（${esc(err.code || err.message)}）。請確認 Firestore 規則已更新。</p>`;
          }
        }

        onAuthStateChanged(auth, user => {
          if (user) { loadNotes(user); loadFeedback(); }
          else { loginUI(); fbBox.innerHTML = `<p class="msg">請先在上方「留言」區用 Google 登入。</p>`; }
        });
      } catch (err) {
        notesBox.innerHTML = `<p class="msg">登入功能載入失敗：${esc(err.code || err.message)}</p>`;
      }
    })();

    const start = new Date(Date.now() - 29 * 864e5).toLocaleDateString("sv-SE", { timeZone: "Asia/Taipei" });
    // 每個計數是一份文件：total__欄位、d_日期__欄位，欄位值放在 n
    const [totSnap, daySnap] = await Promise.all([
      getDocs(query(collection(db, "portalStats"), where(documentId(), ">=", "total__"), where(documentId(), "<=", "total__~"))),
      getDocs(query(collection(db, "portalStats"), where(documentId(), ">=", "d_" + start), where(documentId(), "<=", "d_9999")))
    ]);
    const T = {};
    totSnap.forEach(d => { T[d.id.split("__")[1]] = d.data().n || 0; });
    const byDay = {};
    daySnap.forEach(d => {
      const [day, field] = d.id.slice(2).split("__");
      if (!field) return;            // 略過舊格式的文件
      (byDay[day] ||= {})[field] = d.data().n || 0;
    });

    tiles.innerHTML = `
      <div class="tile j"><small>每日訪客（累計）</small><b>${n(T.visitors)}</b><span>同一裝置一天只算一次</span></div>
      <div class="tile"><small>瀏覽次數</small><b>${n(T.views)}</b><span>每開一次頁面算一次</span></div>
      <div class="tile"><small>遊戲點擊</small><b>${n(sumPrefix(T,"game"))}</b></div>
      <div class="tile"><small>下載點擊</small><b>${n(sumPrefix(T,"download"))}</b></div>
      <div class="tile"><small>捐款點擊</small><b>${n(sumPrefix(T,"support"))}</b></div>`;

    const rows = Object.keys(byDay).map(day => ({ day, ...byDay[day] })).sort((a,b) => b.day.localeCompare(a.day));
    days.innerHTML = rows.length
      ? `<table><tr><th>日期</th><th>訪客</th><th>瀏覽</th><th>遊戲</th><th>下載</th><th>捐款</th></tr>` +
        rows.map(r => `<tr><td>${r.day}</td><td>${n(r.visitors)}</td><td>${n(r.views)}</td><td>${n(sumPrefix(r,"game"))}</td><td>${n(sumPrefix(r,"download"))}</td><td>${n(sumPrefix(r,"support"))}</td></tr>`).join("") + `</table>`
      : `<p class="msg">最近 30 天還沒有資料。</p>`;

    const NAMES = { game: "遊戲", download: "下載", support: "捐款" };
    const items = Object.keys(T).filter(k => /^(game|download|support)_/.test(k)).sort()
      .map(k => { const [p, ...rest] = k.split("_"); return `<tr><td>${NAMES[p]} · ${rest.join("_")}</td><td>${n(T[k])}</td></tr>`; });
    clicks.innerHTML = items.length ? `<table><tr><th>項目</th><th>次數</th></tr>${items.join("")}</table>` : `<p class="msg">還沒有點擊紀錄。</p>`;
  }
} catch (e) {
  fail("讀取 Firebase 失敗：" + (e.code || e.message) + "（請確認 firebase-config.js 和 Firestore 規則）");
}
</script>
</body>
</html>
