<style>
:root{
  --cream:#f5eddc; --paper:#fbf7ee; --line:#e2d5bc;
  --ink:#2a231e; --ink-soft:#5f544b; --ink-faint:#8c8075;
  --brick:#a63d2f; --brick-deep:#842d21; --brick-soft:#f4ddd5;
  --jade:#3c7c66; --jade-deep:#2c5e4d; --jade-soft:#dfece5;
  --gold:#b98b2c; --gold-deep:#8e6a1f; --gold-soft:#f2e5c2;
  --radius:14px;
  --serif:"Noto Serif TC", "Songti TC", serif;
  --sans:"Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-behavior:smooth; scroll-padding-top:72px}
body{
  margin:0; font-family:var(--sans); color:var(--ink); line-height:1.65;
  background:
    radial-gradient(1200px 500px at 85% -10%, #efe1c6 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 30%, #f0e6d3 0%, transparent 55%),
    var(--cream);
}
a{color:inherit}
img{max-width:100%; display:block}
.wrap{max-width:1080px; margin:0 auto; padding:0 16px}

/* ---- header ---- */
header{
  position:sticky; top:0; z-index:20;
  background:rgba(245,237,220,.88); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.bar{display:flex; align-items:center; gap:12px; height:60px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; font-family:var(--serif); font-weight:900; font-size:1.05rem; white-space:nowrap}
.seal-s{width:30px; height:30px; border-radius:6px; background:var(--brick); color:#fff4ea; display:grid; place-items:center; font-size:.8rem; line-height:1; transform:rotate(-4deg); box-shadow:inset 0 0 0 2px rgba(255,240,230,.35)}
nav{margin-left:auto; display:flex; gap:4px}
nav a{text-decoration:none; font-size:.92rem; padding:6px 10px; border-radius:8px; color:var(--ink-soft)}
nav a:hover{background:var(--paper); color:var(--ink)}
.lang{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--paper); flex-shrink:0}
.lang button{border:0; background:none; font:inherit; font-size:.82rem; font-weight:700; padding:5px 11px; cursor:pointer; color:var(--ink-faint)}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
@media (max-width:640px){ nav{display:none} .lang{margin-left:auto} }

/* ---- hero ---- */
.hero{padding:64px 0 48px; display:grid; grid-template-columns:1fr auto; gap:32px; align-items:center}
.hero h1{font-family:var(--serif); font-weight:900; font-size:clamp(2.1rem,6vw,3.4rem); line-height:1.15; margin:0 0 6px; letter-spacing:.02em}
.hero .sub{font-family:var(--serif); color:var(--brick); font-weight:600; margin:0 0 18px; font-size:1.05rem}
.hero p.tag{font-size:1.08rem; color:var(--ink-soft); max-width:34em; margin:0 0 26px}
.ctas{display:flex; gap:10px; flex-wrap:wrap}
.btn{display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-weight:700; font-size:.95rem; padding:11px 18px; border-radius:10px; border:1.5px solid transparent; cursor:pointer; transition:transform .15s, background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-brick{background:var(--brick); color:#fff8f2}
.btn-brick:hover{background:var(--brick-deep)}
.btn-line{border-color:var(--ink); color:var(--ink); background:transparent}
.btn-line:hover{background:var(--paper)}
.btn-jade{background:var(--jade); color:#f6fbf8}
.btn-jade:hover{background:var(--jade-deep)}
.btn[aria-disabled="true"]{background:#e6dccb; color:var(--ink-faint); border-color:transparent; pointer-events:none}

.seal-big{
  width:170px; height:170px; border-radius:18px; background:var(--brick); color:#fff3e8;
  display:grid; grid-template-columns:1fr 1fr; place-items:center;
  font-family:var(--serif); font-weight:900; font-size:3.4rem; line-height:1;
  padding:18px;
  transform:rotate(5deg);
  box-shadow: inset 0 0 0 5px var(--brick), inset 0 0 0 8px rgba(255,240,228,.75), 0 18px 40px -18px rgba(132,45,33,.55);
  -webkit-mask-image: radial-gradient(circle at 30% 20%, #000 60%, rgba(0,0,0,.88) 100%);
}
@media (max-width:720px){ .hero{grid-template-columns:1fr; padding-top:40px} .seal-big{width:110px; height:110px; font-size:2.1rem; order:-1; padding:10px} }

/* ---- sections ---- */
section{padding:48px 0}
.sec-head{display:flex; align-items:center; gap:12px; margin-bottom:8px}
.sec-head .mark{width:12px; height:12px; background:var(--brick); border-radius:2px; transform:rotate(45deg)}
.sec-head h2{font-family:var(--serif); font-weight:900; font-size:clamp(1.5rem,4vw,2rem); margin:0}
.sec-intro{color:var(--ink-soft); margin:0 0 26px; max-width:40em}

/* ---- game cards ---- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px}
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:20px; display:flex; flex-direction:column; gap:10px; transition:box-shadow .2s, transform .2s}
.card:hover{box-shadow:0 14px 30px -20px rgba(42,35,30,.45); transform:translateY(-2px)}
.card-top{display:flex; gap:14px; align-items:center}
.glyph{width:54px; height:54px; flex-shrink:0; border-radius:10px; display:grid; place-items:center; font-family:var(--serif); font-weight:900; font-size:1.7rem; color:#fff8f0; transform:rotate(-3deg)}
.glyph.brick{background:var(--brick)} .glyph.jade{background:var(--jade)} .glyph.gold{background:var(--gold)}
.card h3{margin:0; font-family:var(--serif); font-size:1.12rem; line-height:1.3}
.card .alt{font-size:.82rem; color:var(--ink-faint)}
.card p{margin:0; color:var(--ink-soft); font-size:.94rem; flex:1}
.tags{display:flex; gap:6px; flex-wrap:wrap}
.tags span{font-size:.75rem; font-weight:500; padding:2px 9px; border-radius:999px; background:var(--gold-soft); color:var(--gold-deep)}
.card .btn{align-self:flex-start; padding:8px 15px; font-size:.9rem}

/* ---- font ---- */
.font-grid{display:grid; grid-template-columns:1fr 1.1fr; gap:20px; align-items:start}
@media (max-width:820px){ .font-grid{grid-template-columns:1fr} }
.panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:22px}
.preview{text-align:center}
.preview .sample{font-family:var(--serif); font-weight:600; font-size:clamp(1.7rem,6vw,2.4rem); line-height:2.4; color:var(--ink); margin:6px 0 4px}
.preview ruby{ruby-position:over; margin:0 .04em}
.preview rt{font-family:var(--sans); font-size:.42em; font-weight:500; color:var(--brick); letter-spacing:0}
.preview .demo-note{font-size:.78rem; color:var(--ink-faint)}
.meta{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:14px}
.pill{font-size:.8rem; font-weight:700; padding:3px 11px; border-radius:999px; background:var(--jade-soft); color:var(--jade-deep)}
.pill.b{background:var(--brick-soft); color:var(--brick-deep)}
.font-desc{color:var(--ink-soft); margin:14px 0 0; text-align:left; font-size:.95rem}

.dl-list{display:flex; flex-direction:column; gap:10px; margin-bottom:22px}
.dl{display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line); background:#fffdf8; text-decoration:none; transition:border-color .15s, background .15s}
.dl:hover{border-color:var(--jade); background:var(--jade-soft)}
.dl .ic{width:38px; height:38px; flex-shrink:0; border-radius:9px; background:var(--jade); color:#fff; display:grid; place-items:center}
.dl .ic svg{width:20px; height:20px}
.dl b{display:block; font-size:.98rem}
.dl .ver{font-style:normal; font-size:.72rem; font-weight:700; padding:1px 7px; margin-left:4px; border-radius:999px; background:var(--brick-soft); color:var(--brick-deep); vertical-align:2px}
.dl small{color:var(--ink-faint); font-size:.82rem}
.dl[aria-disabled="true"]{pointer-events:none; opacity:.6}
.dl[aria-disabled="true"] .ic{background:var(--ink-faint)}
h4{font-family:var(--serif); font-size:1rem; margin:20px 0 8px}
h4:first-child{margin-top:0}
.req{font-size:.9rem; color:var(--ink-soft); background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin:0}
ol.steps{margin:0; padding-left:1.4em; font-size:.92rem; color:var(--ink-soft)}
ol.steps li{margin-bottom:6px}
details{border-top:1px solid var(--line); margin-top:18px; padding-top:12px}
summary{cursor:pointer; font-weight:700; font-size:.92rem}
.log{list-style:none; padding:0; margin:10px 0 0; font-size:.88rem; color:var(--ink-soft)}
.log li{padding:6px 0; border-bottom:1px dashed var(--line)}
.log b{color:var(--ink)}
.license{font-size:.82rem; color:var(--ink-faint); margin:16px 0 0}
.report{display:inline-block; margin-top:14px; font-size:.9rem; font-weight:700; color:var(--brick)}

/* ---- support ---- */
.support{background:var(--ink); color:#f1e8d8; border-radius:20px; padding:36px 28px; position:relative; overflow:hidden}
.support::after{content:"謝"; position:absolute; right:-10px; bottom:-40px; font-family:var(--serif); font-weight:900; font-size:12rem; color:rgba(255,255,255,.03); pointer-events:none; line-height:1}
.support h2{color:#fff8ec}
.support .sec-intro{color:#cfc3b2}
.pay-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; position:relative; z-index:1}
.pay{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:10px}
.pay .who{font-size:.8rem; color:var(--gold); font-weight:700}
.pay .nm{font-family:var(--serif); font-size:1.3rem; font-weight:900; color:#fff}
.pay img{width:140px; border-radius:10px; background:#fff; padding:6px}
.pay .btn{align-self:flex-start}
.pay .pending{font-size:.85rem; color:#a99d8d}

footer{padding:36px 0 48px; text-align:center; font-size:.85rem; color:var(--ink-faint)}
footer a{color:var(--ink-soft)}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top"><span class="seal-s">一分</span><span data-i="brand"></span></a>
    <nav>
      <a href="#games" data-i="navGames"></a>
      <a href="#font" data-i="navFont"></a>
      <a href="#support" data-i="navSupport"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="es">ES</button>
    </div>
  </div>
</header>

<main id="top" class="wrap">

  <div class="hero">
    <div>
      <h1 data-i="brand"></h1>
      <p class="sub" data-i="brandAlt"></p>
      <p class="tag" data-i="tagline"></p>
      <div class="ctas">
        <a class="btn btn-brick" href="#games" data-i="ctaGames"></a>
        <a class="btn btn-line" href="#font" data-i="ctaFont"></a>
      </div>
    </div>
    <div class="seal-big" aria-hidden="true"><span>一</span><span>每</span><span>分</span><span>天</span></div>
  </div>

  <section id="games">
    <div class="sec-head"><span class="mark"></span><h2 data-i="gamesTitle"></h2></div>
    <p class="sec-intro" data-i="gamesIntro"></p>
    <div class="grid" id="gameGrid"></div>
  </section>

  <section id="font">
    <div class="sec-head"><span class="mark"></span><h2 data-i="fontTitle"></h2></div>
    <p class="sec-intro" data-i="fontIntro"></p>
    <div class="font-grid">
      <div class="panel preview">
        <div class="sample">
          <ruby>我<rt>wǒ</rt></ruby><ruby>不<rt>bú</rt></ruby><ruby>是<rt>shì</rt></ruby><ruby>老<rt>lǎo</rt></ruby><ruby>師<rt>shī</rt></ruby><br>
          <ruby>一<rt>yí</rt></ruby><ruby>起<rt>qǐ</rt></ruby><ruby>學<rt>xué</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>文<rt>wén</rt></ruby>
        </div>
        <div class="demo-note" data-i="demoNote"></div>
        <div class="meta" id="fontMeta"></div>
        <p class="font-desc" id="fontDesc"></p>
      </div>
      <div class="panel">
        <h4 data-i="dlTitle"></h4>
        <div class="dl-list" id="dlList"></div>
        <h4 data-i="reqTitle"></h4>
        <p class="req" id="fontReq"></p>
        <h4 data-i="stepsTitle"></h4>
        <ol class="steps" id="fontSteps"></ol>
        <a class="report" id="reportLink" target="_blank" rel="noopener" data-i="report"></a>
        <details>
          <summary data-i="logTitle"></summary>
          <ul class="log" id="fontLog"></ul>
        </details>
        <p class="license" id="fontLicense"></p>
      </div>
    </div>
  </section>

  <section id="support">
    <div class="support">
      <div class="sec-head"><span class="mark" style="background:var(--gold)"></span><h2 data-i="supportTitle"></h2></div>
      <p class="sec-intro" data-i="supportIntro"></p>
      <div class="pay-grid" id="payGrid"></div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    © <span id="year"></span> <span data-i="brand"></span> · <a id="handle" target="_blank" rel="noopener"></a>
  </div>
</footer>

<script>
/* ===== 介面固定文字（一般不用改） ===== */
const UI = {
  brand:      CONFIG.site.brand,
  brandAlt:   { zh: CONFIG.site.brand.es, es: CONFIG.site.brand.zh },
  tagline:    CONFIG.site.tagline,
  navGames:   { zh: "小遊戲", es: "Juegos" },
  navFont:    { zh: "拼音字體", es: "Fuente pinyin" },
  navSupport: { zh: "支持", es: "Apoyar" },
  ctaGames:   { zh: "玩小遊戲", es: "Ver los juegos" },
  ctaFont:    { zh: "下載拼音字體", es: "Descargar la fuente" },
  gamesTitle: { zh: "中文小遊戲", es: "Juegos para aprender chino" },
  gamesIntro: { zh: "全部免費，打開瀏覽器就能玩，手機也可以。介面是西班牙文，中文附台灣讀音拼音。",
                es: "Todos gratis, directamente en el navegador, también en el móvil. Chino con pinyin según la pronunciación de Taiwán." },
  play:       { zh: "開始玩", es: "Jugar" },
  soon:       { zh: "即將推出", es: "Próximamente" },
  fontTitle:  { zh: "GoodTeacher 拼音字體", es: "Fuente pinyin GoodTeacher" },
  fontIntro:  { zh: "給中文老師做講義、簡報用。免費下載，歡迎分享。",
                es: "Para profesores de chino que preparan fichas y presentaciones. Descarga gratuita." },
  demoNote:   { zh: "▲ 效果示意", es: "▲ Ejemplo del resultado" },
  version:    { zh: "版本", es: "Versión" },
  updated:    { zh: "更新", es: "Actualizado" },
  dlTitle:    { zh: "下載", es: "Descargas" },
  reqTitle:   { zh: "使用環境", es: "Requisitos" },
  stepsTitle: { zh: "快速安裝", es: "Instalación rápida" },
  logTitle:   { zh: "更新紀錄", es: "Historial de versiones" },
  report:     { zh: "發現讀音錯誤？回報給我 →", es: "¿Un pinyin incorrecto? Avísame →" },
  supportTitle:{ zh: "請我喝杯咖啡", es: "Invítame a un café" },
  supportIntro:{ zh: "所有遊戲和字體都免費。如果它們對你有幫助，歡迎小額支持，讓我繼續做下去。謝謝你！",
                 es: "Los juegos y la fuente son y seguirán siendo gratis. Si te resultan útiles, un pequeño aporte me ayuda a seguir creando. ¡Gracias!" },
  give:       { zh: "前往支持", es: "Apoyar" },
  pending:    { zh: "（尚未設定）", es: "(Pendiente)" }
};

const DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';

let lang = "zh";
const t = v => (v == null ? "" : typeof v === "string" ? v : (v[lang] ?? v.zh ?? ""));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

/* ===== 統計（Firebase）=====
   每個計數是一份文件，只有一個欄位 n：
   portalStats/total__欄位 與 portalStats/d_日期__欄位（台灣時間）
   欄位：views 瀏覽次數、visitors 每日訪客、game_xxx / download_xxx / support_xxx 點擊次數 */
var STAT_QUEUE = [];
function todayTW(){ return new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Taipei" }); }
function isOwner(){ try { return localStorage.getItem("portal-owner") === "1"; } catch(e){ return false; } }
function track(field){
  if (isOwner()) return Promise.resolve();
  if (window.__statWrite) return window.__statWrite(field);
  STAT_QUEUE.push(field); return Promise.resolve();
}
function countVisit(){
  track("views");
  try {
    const d = todayTW();
    if (localStorage.getItem("portal-visit-day") !== d){ localStorage.setItem("portal-visit-day", d); track("visitors"); }
  } catch(e){}
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-track]");
  if (!a) return;
  const p = track(a.dataset.track);
  // 下載連結會在同一頁跳轉，先等記錄送出（最多 1.2 秒）再下載，避免記錄被中斷
  if (!a.target && a.href && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
    e.preventDefault();
    const href = a.href;
    Promise.race([p, new Promise(r => setTimeout(r, 1200))]).finally(() => { location.href = href; });
  }
});

/* ===== 畫面 ===== */
function render(){
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "es";
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(UI[el.dataset.i]); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  // games
  document.getElementById("gameGrid").innerHTML = CONFIG.games.map(g => {
    const other = lang === "zh" ? g.title.es : g.title.zh;
    const btn = g.url
      ? `<a class="btn btn-brick" href="${esc(g.url)}" target="_blank" rel="noopener" data-track="game_${esc(g.id)}">${esc(t(UI.play))} ▸</a>`
      : `<span class="btn" aria-disabled="true">${esc(t(UI.soon))}</span>`;
    return `<article class="card">
      <div class="card-top">
        <div class="glyph ${esc(g.color || "brick")}" aria-hidden="true">${esc(g.glyph || "")}</div>
        <div><h3>${esc(t(g.title))}</h3><div class="alt">${esc(other)}</div></div>
      </div>
      <p>${esc(t(g.desc))}</p>
      <div class="tags">${(g.tags||[]).map(x => `<span>${esc(t(x))}</span>`).join("")}</div>
      ${btn}
    </article>`;
  }).join("");

  // font
  const f = CONFIG.font;
  document.getElementById("fontMeta").innerHTML =
    `<span class="pill">${esc(t(UI.updated))} ${esc(f.updated)}</span>`;
  document.getElementById("fontDesc").textContent = t(f.desc);
  document.getElementById("dlList").innerHTML = f.downloads.map(d => {
    const ok = !!d.url;
    return `<a class="dl" ${ok ? `href="${esc(d.url)}" data-track="download_${esc(d.id)}"` : 'aria-disabled="true"'}>
      <span class="ic">${DL_ICON}</span>
      <span><b>${esc(t(d.label))}${d.version ? ` <em class="ver">${esc(d.version)}</em>` : ""}</b><small>${esc(ok ? t(d.note) : t(UI.soon))}</small></span>
    </a>`;
  }).join("");
  document.getElementById("fontReq").textContent = t(f.requirements);
  document.getElementById("fontSteps").innerHTML = f.steps.map(s => `<li>${esc(t(s))}</li>`).join("");
  document.getElementById("fontLog").innerHTML = f.changelog.map(c => `<li><b>${esc(c.version)}</b>${c.date ? " · " + esc(c.date) : ""}<br>${esc(t(c.notes))}</li>`).join("");
  document.getElementById("fontLicense").textContent = t(f.license);
  const rep = document.getElementById("reportLink");
  if (f.reportUrl){ rep.href = f.reportUrl; rep.hidden = false; } else { rep.hidden = true; }

  // support
  document.getElementById("payGrid").innerHTML = CONFIG.support.map(p => `
    <div class="pay">
      <div class="who">${esc(t(p.who))}</div>
      <div class="nm">${esc(p.name)}</div>
      ${p.qr ? `<img src="${esc(p.qr)}" alt="${esc(p.name)} QR code">` : ""}
      ${p.url
        ? `<a class="btn btn-jade" href="${esc(p.url)}" target="_blank" rel="noopener" data-track="support_${esc(p.id)}">${esc(t(UI.give))} ▸</a>`
        : (p.qr ? "" : `<span class="pending">${esc(t(UI.pending))}</span>`)}
    </div>`).join("");

  // footer
  document.getElementById("year").textContent = new Date().getFullYear();
  const h = document.getElementById("handle");
  h.textContent = CONFIG.site.handle;
  if (CONFIG.site.handleUrl) h.href = CONFIG.site.handleUrl; else h.removeAttribute("href");
}

function setLang(l){
  lang = l;
  try { localStorage.setItem("site-lang", l); } catch(e){}
  render();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* 預設語言：上次選的 → 瀏覽器是中文就中文，否則西文 */
(function init(){
  let saved = null;
  try { saved = localStorage.getItem("site-lang"); } catch(e){}
  const q = new URLSearchParams(location.search).get("lang");
  lang = (q === "zh" || q === "es") ? q
       : saved || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "es");
  render();
  countVisit();
})();
</script>

<script src="firebase-config.js"></script>
<script type="module">
/* Firebase 統計：沒填 firebase-config.js 時自動略過，不影響網頁 */
try {
  const cfg = window.FIREBASE_CONFIG;
  if (cfg && cfg.projectId) {
    const V = "10.12.2";
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const { getFirestore, doc, setDoc, increment } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const db = getFirestore(initializeApp(cfg, "portal"));
    window.__statWrite = field => Promise.all(
      ["total", "d_" + todayTW()].map(id =>
        setDoc(doc(db, "portalStats", id + "__" + field), { n: increment(1) }, { merge: true })
          .catch(err => console.warn("stat", id, field, err.code))
      )
    );
    STAT_QUEUE.splice(0).forEach(window.__statWrite);
  }
} catch (e) { console.warn("stats off", e); }
</script>
</body>
</html>
