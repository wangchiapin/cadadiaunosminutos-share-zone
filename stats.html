<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>網站統計</title>
<style>
:root{--cream:#f5eddc;--paper:#fbf7ee;--line:#e2d5bc;--ink:#2a231e;--soft:#6b6056;--brick:#a63d2f;--jade:#3c7c66;--gold:#b98b2c}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--cream);color:var(--ink)}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:1.5rem;margin:0 0 4px}
h2{font-size:1.1rem;margin:34px 0 10px;padding-left:10px;border-left:4px solid var(--brick)}
p.note{color:var(--soft);font-size:.88rem;margin:0 0 14px}
.owner{display:flex;gap:8px;align-items:center;font-size:.9rem;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:14px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile small{color:var(--soft);font-size:.8rem;display:block}
.tile b{font-size:1.8rem;line-height:1.2;display:block}
.tile span{font-size:.78rem;color:var(--soft)}
.tile.j{background:var(--jade);border-color:var(--jade);color:#fff}
.tile.j small,.tile.j span{color:#d7ebe3}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:7px 6px;text-align:right;white-space:nowrap}
th{font-size:.78rem;color:var(--soft);font-weight:700;border-bottom:1px solid var(--line)}
td{border-top:1px dashed var(--line)}
th:first-child,td:first-child{text-align:left}
tr:first-child td{border-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;flex:1;min-width:140px}
button{font:inherit;font-weight:700;padding:8px 16px;border:0;border-radius:8px;background:var(--brick);color:#fff;cursor:pointer}
.rel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.rel h3{font-size:.98rem;margin:0 0 4px}
.rel small{color:var(--soft)}
.msg{color:var(--soft);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>網站統計</h1>
  <p class="note">瀏覽和點擊次數來自 Firebase；字體實際下載次數來自 GitHub Releases。日期以台灣時間計算。</p>

  <label class="owner"><input type="checkbox" id="owner"> 這台裝置的瀏覽不計入統計（你自己的電腦、手機各勾一次）</label>

  <h2>總計</h2>
  <div class="tiles" id="tiles"><p class="msg">讀取中…</p></div>

  <h2>最近 30 天</h2>
  <div class="box" id="days"><p class="msg">讀取中…</p></div>

  <h2>各項點擊（總計）</h2>
  <div class="box" id="clicks"><p class="msg">讀取中…</p></div>

  <h2>字體實際下載（GitHub Releases）</h2>
  <div class="row">
    <input type="text" id="repo" value="wangchiapin/GoodTeacher" aria-label="repo">
    <button id="go">更新</button>
  </div>
  <div id="out"></div>
</div>

<script>
/* ---- 自己的裝置不計入 ---- */
const ownerBox = document.getElementById("owner");
try { ownerBox.checked = localStorage.getItem("portal-owner") === "1"; } catch(e){}
ownerBox.addEventListener("change", () => {
  try { ownerBox.checked ? localStorage.setItem("portal-owner","1") : localStorage.removeItem("portal-owner"); } catch(e){}
});

const n = v => (v || 0).toLocaleString();

/* ---- GitHub Releases ---- */
const out = document.getElementById("out");
async function loadReleases(){
  const repo = document.getElementById("repo").value.trim();
  out.innerHTML = '<p class="msg">讀取中…</p>';
  try{
    const r = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=100`);
    if (!r.ok) throw new Error(r.status === 404 ? "找不到這個 repo（要是公開的，並且已經發布過 Release）" : "GitHub 回應 " + r.status);
    const rels = await r.json();
    if (!rels.length){ out.innerHTML = '<p class="msg">這個 repo 還沒有任何 Release。</p>'; return; }
    let total = 0;
    const html = rels.map(rel => {
      const sum = rel.assets.reduce((a, x) => a + x.download_count, 0);
      total += sum;
      const rows = rel.assets.map(x => `<tr><td>${x.name}</td><td>${n(x.download_count)}</td></tr>`).join("");
      return `<div class="rel"><h3>${rel.name || rel.tag_name} · ${n(sum)} 次</h3>
        <small>發布於 ${new Date(rel.published_at).toLocaleDateString("zh-TW")}</small><table>${rows}</table></div>`;
    }).join("");
    out.innerHTML = `<div class="tiles" style="margin-bottom:10px"><div class="tile j"><small>全部版本總下載</small><b>${n(total)}</b></div></div>` + html;
  }catch(e){ out.innerHTML = `<p class="msg">讀取失敗：${e.message}</p>`; }
}
document.getElementById("go").addEventListener("click", loadReleases);
loadReleases();
</script>

<script src="firebase-config.js"></script>
<script type="module">
const tiles = document.getElementById("tiles"), days = document.getElementById("days"), clicks = document.getElementById("clicks");
const fail = msg => { for (const el of [tiles, days, clicks]) el.innerHTML = `<p class="msg">${msg}</p>`; };
const n = v => (v || 0).toLocaleString();
const sumPrefix = (o, p) => Object.keys(o).filter(k => k.startsWith(p + "_")).reduce((a,k) => a + (o[k]||0), 0);

try {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.projectId) {
    fail("還沒設定 Firebase：請在 firebase-config.js 貼上設定。");
  } else {
    const V = "10.12.2";
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const { getFirestore, collection, getDocs, query, where, documentId } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const db = getFirestore(initializeApp(cfg, "stats"));

    const start = new Date(Date.now() - 29 * 864e5).toLocaleDateString("sv-SE", { timeZone: "Asia/Taipei" });
    const [totSnap, daySnap] = await Promise.all([
      getDocs(query(collection(db, "portalStats"), where(documentId(), "==", "total"))),
      getDocs(query(collection(db, "portalStats"), where(documentId(), ">=", "d_" + start), where(documentId(), "<=", "d_9999")))
    ]);
    const T = totSnap.empty ? {} : totSnap.docs[0].data();

    tiles.innerHTML = `
      <div class="tile j"><small>每日訪客（累計）</small><b>${n(T.visitors)}</b><span>同一裝置一天只算一次</span></div>
      <div class="tile"><small>瀏覽次數</small><b>${n(T.views)}</b><span>每開一次頁面算一次</span></div>
      <div class="tile"><small>遊戲點擊</small><b>${n(sumPrefix(T,"game"))}</b></div>
      <div class="tile"><small>下載點擊</small><b>${n(sumPrefix(T,"download"))}</b></div>
      <div class="tile"><small>捐款點擊</small><b>${n(sumPrefix(T,"support"))}</b></div>`;

    const rows = daySnap.docs.map(d => ({ day: d.id.slice(2), ...d.data() })).sort((a,b) => b.day.localeCompare(a.day));
    days.innerHTML = rows.length
      ? `<table><tr><th>日期</th><th>訪客</th><th>瀏覽</th><th>遊戲</th><th>下載</th><th>捐款</th></tr>` +
        rows.map(r => `<tr><td>${r.day}</td><td>${n(r.visitors)}</td><td>${n(r.views)}</td><td>${n(sumPrefix(r,"game"))}</td><td>${n(sumPrefix(r,"download"))}</td><td>${n(sumPrefix(r,"support"))}</td></tr>`).join("") + `</table>`
      : `<p class="msg">最近 30 天還沒有資料。</p>`;

    const NAMES = { game: "遊戲", download: "下載", support: "捐款" };
    const items = Object.keys(T).filter(k => /^(game|download|support)_/.test(k)).sort()
      .map(k => { const [p, ...rest] = k.split("_"); return `<tr><td>${NAMES[p]} · ${rest.join("_")}</td><td>${n(T[k])}</td></tr>`; });
    clicks.innerHTML = items.length ? `<table><tr><th>項目</th><th>次數</th></tr>${items.join("")}</table>` : `<p class="msg">還沒有點擊紀錄。</p>`;
  }
} catch (e) {
  fail("讀取 Firebase 失敗：" + (e.code || e.message) + "（請確認 firebase-config.js 和 Firestore 規則）");
}
</script>
</body>
</html>
